version: '3.8'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: corebase-postgres
    restart: always
    environment:
      POSTGRES_DB: corebase
      POSTGRES_USER: corebase
      POSTGRES_PASSWORD: ${DB_PASSWORD:-corebase_password}
    ports:
      - "5432:5432" # In prod, maybe don't expose this differently
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - corebase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebase"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache
  redis:
    image: redis:7-alpine
    container_name: corebase-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - corebase-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: corebase-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://corebase:${DB_PASSWORD:-corebase_password}@postgres:5432/corebase
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - corebase-network

networks:
  corebase-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
